services:
  - type: web
    name: waterpower-energy-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string here — see HOSTING.md.
                      # NOT Render's own free Postgres: that one auto-deletes after 30 days.
      - key: WATERPOWER_USERNAME
        sync: false   # set manually in the Render dashboard — don't commit real credentials
      - key: WATERPOWER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true   # Render generates a random 32+ char secret automatically
